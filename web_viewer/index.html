<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>RideTrack • Live Ride Viewer</title>
  
  <!-- Google Fonts: Outfit & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  
  <!-- Custom Stylesheet -->
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body class="dark-theme">
  <!-- Top Navigation / Status Header -->
  <header class="app-header">
    <div class="brand-container">
      <div class="brand-logo">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="5.5" cy="17.5" r="3.5"/>
          <circle cx="18.5" cy="17.5" r="3.5"/>
          <path d="M15 6a1 1 0 1 0 0-2 1 1 0 0 0 0 2zm-3 11.5V14l-3-3 4-3 2 3h4"/>
        </svg>
      </div>
      <div class="brand-text">
        <h1>RideTrack <span class="badge-live"><span class="pulse-dot"></span> LIVE</span></h1>
        <p class="subtitle" id="bike-title">Connecting to live rider feed...</p>
      </div>
    </div>

    <div class="header-status">
      <div class="status-chip" id="connection-chip">
        <span class="status-indicator"></span>
        <span id="connection-status">Connecting</span>
      </div>
    </div>
  </header>

  <!-- Main Map View Container -->
  <main class="main-container">
    <div id="live-map" class="map-view"></div>

    <!-- Live Telemetry Floating HUD -->
    <section class="telemetry-hud" id="telemetry-panel">
      <!-- Speedometer Hero Card -->
      <div class="hud-card speed-card">
        <div class="hud-label">CURRENT SPEED</div>
        <div class="speed-display">
          <span class="speed-value" id="current-speed">0</span>
          <span class="speed-unit">KM/H</span>
        </div>
        <div class="speed-bar-container">
          <div class="speed-bar-fill" id="speed-bar" style="width: 0%;"></div>
        </div>
      </div>

      <!-- Quick Metrics Grid -->
      <div class="hud-metrics-grid">
        <div class="metric-item">
          <div class="metric-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
          </div>
          <div class="metric-data">
            <span class="metric-label">DISTANCE</span>
            <span class="metric-val" id="total-distance">0.0 <small>km</small></span>
          </div>
        </div>

        <div class="metric-item">
          <div class="metric-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
          </div>
          <div class="metric-data">
            <span class="metric-label">DURATION</span>
            <span class="metric-val" id="ride-duration">00:00:00</span>
          </div>
        </div>

        <div class="metric-item">
          <div class="metric-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="7" width="16" height="10" rx="2" ry="2"/><line x1="22" y1="11" x2="22" y2="13"/></svg>
          </div>
          <div class="metric-data">
            <span class="metric-label">PHONE BATTERY</span>
            <span class="metric-val" id="battery-level">--%</span>
          </div>
        </div>

        <div class="metric-item">
          <div class="metric-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 2v3m0 14v3M2 12h3m14 0h3"/></svg>
          </div>
          <div class="metric-data">
            <span class="metric-label">LAST UPDATED</span>
            <span class="metric-val" id="last-update">Just now</span>
          </div>
        </div>
      </div>
    </section>

    <!-- Map Floating Controls -->
    <div class="map-controls">
      <button class="map-btn" id="btn-recenter" title="Recenter on Bike">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="3 11 22 2 13 21 11 13 3 11"/></svg>
      </button>
      <button class="map-btn" id="btn-toggle-follow" title="Toggle Auto-Follow">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
      </button>
    </div>
  </main>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <!-- Viewer App Script -->
  <script src="/static/app.js"></script>
</body>
</html>
