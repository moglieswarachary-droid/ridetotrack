name: ridetrack
description: "RideTrack Motorcycle & Bike Tracking Application - Smartphone-Only Sensor & GNSS Pipeline"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management & Architecture
  provider: ^6.1.2
  
  # Networking & WebSockets
  http: ^1.2.2
  web_socket_channel: ^3.0.1
  
  # Mapping & Geo Calculations
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  
  # Sensor & Device Hardware (Smartphone-only tracking)
  geolocator: ^12.0.0
  sensors_plus: ^6.0.1
  battery_plus: ^6.0.2
  connectivity_plus: ^6.0.4
  
  # Local Storage & Offline Queueing
  shared_preferences: ^2.2.3
  sqflite: ^2.3.3+1
  path_provider: ^2.1.3
  path: ^1.9.0
  
  # UI & Animations
  intl: ^0.19.0
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
