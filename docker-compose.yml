version: '3.8'

services:
  # PostgreSQL with PostGIS extension for spatial queries
  postgres:
    image: postgis/postgis:16-3.4
    container_name: ridetrack_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ridetrack
      POSTGRES_USER: ridetrack_user
      POSTGRES_PASSWORD: ridetrack_secure_password_2026
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ridetrack_user -d ridetrack"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis for real-time live telemetry state and WebSocket pub/sub
  redis:
    image: redis:7-alpine
    container_name: ridetrack_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # RideTrack FastAPI Backend
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ridetrack_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://ridetrack_user:ridetrack_secure_password_2026@postgres:5432/ridetrack
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ridetrack-production-super-secret-key-change-in-prod-7829471923
      ENVIRONMENT: production
      DEBUG: "false"
      CORS_ORIGINS: "*"
    ports:
      - "8000:8000"

volumes:
  pgdata:
  redisdata:
